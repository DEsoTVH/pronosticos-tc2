name: Respaldo de datos de boxeo

on:
  schedule:
    # Cada domingo a las 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  respaldo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Solo datos públicos de boxeo (el repositorio es público: nunca votos ni perfiles).
      - run: npm run backup
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: respaldo-boxeo
          path: backups/
          retention-days: 90
