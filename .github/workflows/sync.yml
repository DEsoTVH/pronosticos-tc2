name: Sincronizar con Boxerbook

on:
  schedule:
    # Todos los días a las 09:00 UTC
    - cron: "0 9 * * *"
    # Fines de semana: cada 2 h entre 00:00 y 06:00 UTC y entre 18:00 y 23:00 UTC (resultados)
    - cron: "0 0-6/2,18-23/2 * * 0,6"
  workflow_dispatch: # botón manual desde la pestaña Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOXERBOOK_API_KEY: ${{ secrets.BOXERBOOK_API_KEY }}
      # Rankings por organismo y fichas de boxeadores: solo los lunes (no cambian a diario)
      - name: Rankings y fichas (lunes)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm run sync -- rankings
            npm run sync -- fichas 150
            npm run sync -- fotos 200
            npm run sync -- fotos-copiar 200
            npm run sync -- historial 300
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOXERBOOK_API_KEY: ${{ secrets.BOXERBOOK_API_KEY }}
